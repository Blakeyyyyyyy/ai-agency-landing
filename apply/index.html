<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Jarvis 2.0 application + inline Calendly booking; on booking -> /apply-confirm/ (Rohen, 12 Nov 2026). Answers -> relay /api/apply -> Close + #call-bookings.
     Booking -> Calendly org webhook -> calendly-webhook.js (Call Booked under the closer). No Meta pixel (organic webinar traffic). -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Apply: Jarvis 2.0 with Blake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0a0a0a;--ink:#fff;--dim:#cfcfcf;--green:#32d09f;--line:#2c2c2c;--display:'Archivo',Arial,sans-serif;--mono:'IBM Plex Mono',Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:600;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bar{position:fixed;top:0;left:0;right:0;height:4px;background:#1c1c1c;z-index:5}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .35s ease}
.top{display:flex;justify-content:center;align-items:center;padding:22px 0 0}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1rem;letter-spacing:.5px;text-decoration:none;color:#fff}
.logo .chip{background:var(--green);color:#04140f;border-radius:7px;padding:2px 7px}
.stage{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;padding:20px 22px}
.q{width:100%;max-width:640px;display:none}
.q.on{display:block;animation:in .38s cubic-bezier(.2,.7,.3,1) both}
.q.back{animation:inb .38s cubic-bezier(.2,.7,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateY(-34px)}to{opacity:1;transform:none}}
.intro{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-bottom:18px}
.qt{display:flex;gap:10px;font-size:clamp(1.3rem,4.4vw,1.8rem);font-weight:800;line-height:1.3}
.qt .n{color:var(--green);font-size:.9rem;font-family:var(--mono);padding-top:.45em;white-space:nowrap}
.qt .n:after{content:' \2192'}
.qd{color:#9a9a9a;font-size:1rem;margin:8px 0 0 36px}
.body{margin:26px 0 0 36px}
input.t,textarea.t{width:100%;background:transparent;border:0;border-bottom:2px solid #3a3a3a;color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(1.2rem,4vw,1.6rem);padding:8px 0;outline:none;border-radius:0}
input.t:focus,textarea.t:focus{border-bottom-color:var(--green)}
input.t::placeholder,textarea.t::placeholder{color:#555}
textarea.t{resize:none;min-height:46px;max-height:220px;line-height:1.35}
.ch{display:flex;flex-direction:column;gap:9px;max-width:440px}
.ch button{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(50,208,159,.06);border:1.5px solid rgba(50,208,159,.35);color:#fff;border-radius:8px;padding:11px 14px;font-family:var(--display);font-weight:700;font-size:1.02rem;cursor:pointer;transition:background .15s,border-color .15s}
.ch button:hover{background:rgba(50,208,159,.14)}
.ch button.sel{background:rgba(50,208,159,.22);border-color:var(--green)}
.ch button.sel{animation:blink .3s 2}
@keyframes blink{50%{background:rgba(50,208,159,.06)}}
.ch .k{flex:0 0 auto;font-family:var(--mono);font-size:.72rem;border:1.5px solid rgba(50,208,159,.5);color:var(--green);border-radius:4px;padding:1px 6px;background:#0a0a0a}
.ch button.sel .k{background:var(--green);color:#04140f}
.ok{display:flex;align-items:center;gap:12px;margin-top:22px}
.ok button{background:var(--green);color:#04140f;border:0;border-radius:8px;font-family:var(--display);font-weight:900;font-size:1.02rem;padding:11px 20px;cursor:pointer}
.ok button:disabled{opacity:.6;cursor:wait}
.ok span{font-family:var(--mono);font-size:.72rem;color:#8a8a8a}
.ok span b{color:#cfcfcf}
.err{color:#ff8a8a;font-size:.92rem;margin-top:12px;min-height:1.3em}
.nav{position:fixed;right:18px;bottom:18px;display:flex;gap:2px;z-index:5}
.nav button{background:var(--green);color:#04140f;border:0;width:38px;height:34px;font-size:1rem;font-weight:900;cursor:pointer}
.nav button:first-child{border-radius:6px 0 0 6px}.nav button:last-child{border-radius:0 6px 6px 0}
.nav button:disabled{opacity:.4;cursor:default}
.hp{position:absolute;left:-9999px}
#calwrap{width:100%;max-width:1000px;display:none}
#calwrap.on{display:block;animation:in .38s both}
#calwrap h2{text-align:center;font-size:clamp(1.4rem,4.5vw,2rem);font-weight:900}
#calwrap h2 em{font-style:normal;color:var(--green)}
#calwrap p{text-align:center;color:var(--dim);margin:6px 0 16px}
#cal{min-width:280px;height:720px;border-radius:14px;overflow:hidden;background:#fff}
@media(max-width:560px){.qd,.body{margin-left:0}.qt{flex-direction:column;gap:4px}.qt .n{padding-top:0}#cal{height:780px}.stage{align-items:flex-start;padding-top:8vh}}
</style>
</head>
<body>
<div class="bar"><i id="bar"></i></div>
<div class="top"><a class="logo" href="/"><span class="chip">AI</span> AGENCY</a></div>
<div class="stage" id="stage">
  <div id="qs" style="width:100%;max-width:640px"></div>
  <div id="calwrap">
    <h2>Last step, <em id="fn">you</em>. Pick a time.</h2>
    <p>Your details are already filled in. Choose a slot and confirm.</p>
    <div id="cal"></div>
  </div>
</div>
<input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="nav" id="nav"><button id="up" aria-label="Previous">&#8963;</button><button id="down" aria-label="Next">&#8964;</button></div>

<script src="https://assets.calendly.com/assets/external/widget.js" async></script>
<script>
(function(){
  var API = 'https://blake-discord-relay.vercel.app/api/apply';
  var CAL = 'https://calendly.com/d/d2tv-f6t-jdx/jarvis-strategy-call';
  var Q = [
    {k:'first_name', t:"What's your first name?", type:'text', ph:'Type your answer here...', intro:'Jarvis 2.0 application &middot; takes 2 minutes', ac:'given-name'},
    {k:'last_name', t:'And your last name, {first}?', type:'text', ph:'Type your answer here...', ac:'family-name'},
    {k:'email', t:"What's the best email to reach you on?", type:'email', ph:'name@example.com', ac:'email'},
    {k:'phone', t:"And your phone number?", d:"Include your country code. We'll text you before the call.", type:'tel', ph:'+1 555 123 4567', ac:'tel'},
    {k:'situation', t:'What best describes you right now?', c:['Complete beginner with AI','Employed, want to build this on the side','Freelancer or agency owner','Business owner']},
    {k:'income', t:'What are you currently making per month?', c:['Under $2k','$2k-$5k','$5k-$10k','$10k+']},
    {k:'goal', t:'Where do you want to be per month 90 days from now?', c:['$5k-$10k','$10k-$20k','$20k-$50k','$50k+']},
    {k:'why_now', t:'Why is now the time for you to start selling AI to businesses? What has stopped you so far?', type:'long', ph:'Type your answer here...'},
    {k:'hours', t:'How many hours a week can you commit?', c:['Under 5','5-10','10-20','20+']},
    {k:'invest', t:'This is a 90-day program with direct support. How much can you invest to get your AI business running?', c:['Under $1k','$1k-$3k','$3k-$5k','$5k+']},
    {k:'ready', t:'If accepted, can you start within 7 days?', c:['Yes','No'], keys:['Y','N']}
  ];
  var A = {}, cur = 0, busy = false, wrap = document.getElementById('qs');
  var esc = function(x){ return String(x).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

  Q.forEach(function(q, i){
    var el = document.createElement('div'); el.className = 'q'; el.id = 'q' + i;
    var h = (q.intro ? '<div class="intro">' + q.intro + '</div>' : '') +
      '<div class="qt"><span class="n">' + (i+1) + '</span><span class="tt"></span></div>' + (q.d ? '<div class="qd">' + q.d + '</div>' : '') + '<div class="body">';
    if (q.c) {
      h += '<div class="ch">' + q.c.map(function(o, j){ var key = q.keys ? q.keys[j] : String.fromCharCode(65 + j); return '<button type="button" data-v="' + esc(o) + '" data-key="' + key + '"><span class="k">' + key + '</span>' + esc(o) + '</button>'; }).join('') + '</div>';
    } else if (q.type === 'long') {
      h += '<textarea class="t" rows="1" placeholder="' + q.ph + '"></textarea>';
    } else {
      h += '<input class="t" type="' + q.type + '" placeholder="' + q.ph + '" autocomplete="' + (q.ac || 'off') + '"' + (q.type === 'tel' ? ' inputmode="tel"' : '') + '>';
    }
    h += '<div class="ok"><button type="button" class="okb">' + (i === Q.length - 1 ? 'Submit' : 'OK') + '</button><span>' + (q.type === 'long' ? 'press <b>Enter</b> &middot; <b>Shift + Enter</b> for a new line' : q.c ? '' : 'press <b>Enter &#8629;</b>') + '</span></div><div class="err"></div></div>';
    el.innerHTML = h; wrap.appendChild(el);
    el.querySelector('.okb').addEventListener('click', function(){ next(); });
    if (q.c) el.querySelectorAll('.ch button').forEach(function(b){ b.addEventListener('click', function(){ pick(i, b); }); });
    var inp = el.querySelector('.t');
    if (inp && q.type === 'long') inp.addEventListener('input', function(){ inp.style.height = 'auto'; inp.style.height = inp.scrollHeight + 'px'; });
  });

  function title(i){ var first = (A.first_name || '').split(' ')[0]; return esc(Q[i].t.replace('{first}', first || 'there')); }
  function show(i, dir){
    var prev = document.getElementById('q' + cur); prev.classList.remove('on','back');
    cur = i; var el = document.getElementById('q' + i);
    el.querySelector('.tt').innerHTML = title(i);
    el.querySelector('.err').textContent = '';
    el.classList.add('on'); if (dir < 0) el.classList.add('back');
    var inp = el.querySelector('.t'); if (inp) setTimeout(function(){ inp.focus(); }, 60);
    document.getElementById('bar').style.width = (i / Q.length * 100) + '%';
    document.getElementById('up').disabled = i === 0;
  }
  function err(m){ document.getElementById('q' + cur).querySelector('.err').textContent = m; }
  function pick(i, b){
    if (busy) return;
    var el = document.getElementById('q' + i);
    el.querySelectorAll('.ch button').forEach(function(x){ x.classList.remove('sel'); });
    b.classList.add('sel'); A[Q[i].k] = b.getAttribute('data-v');
    busy = true; setTimeout(function(){ busy = false; next(); }, 450);
  }
  function next(){
    var q = Q[cur], el = document.getElementById('q' + cur), inp = el.querySelector('.t');
    if (inp) A[q.k] = inp.value.trim();
    var v = A[q.k] || '';
    if (!v) return err(q.c ? 'Please pick an option' : 'Please fill this in');
    if (q.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return err("Hmm, that email doesn't look right");
    if (q.type === 'tel' && v.replace(/\D/g, '').length < 7) return err('Please add your full number with country code');
    if (cur < Q.length - 1) return show(cur + 1, 1);
    submit();
  }
  function submit(){
    var b = document.getElementById('q' + cur).querySelector('.okb'); b.disabled = true; b.textContent = 'Submitting...';
    var payload = Object.assign({ website: document.getElementById('website').value }, A);
    fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      .then(function(r){ return r.json(); })
      .then(function(r){ if (!r.ok) throw new Error(r.error || 'error'); showCal(); })
      .catch(function(){ b.disabled = false; b.textContent = 'Submit'; err('Something went wrong. Please try again.'); });
  }
  function showCal(){
    wrap.style.display = 'none'; document.getElementById('nav').style.display = 'none';
    document.getElementById('bar').style.width = '100%';
    document.getElementById('fn').textContent = (A.first_name || 'you').split(' ')[0];
    document.getElementById('calwrap').classList.add('on');
    document.getElementById('stage').style.alignItems = 'flex-start';
    (function init(){
      if (!window.Calendly) return setTimeout(init, 200);
      Calendly.initInlineWidget({ url: CAL + '?hide_gdpr_banner=1&background_color=ffffff&primary_color=1fa87c', parentElement: document.getElementById('cal'),
        prefill: { name: A.first_name + ' ' + A.last_name, email: A.email, customAnswers: { a1: A.phone } } });
    })();
  }
  document.addEventListener('keydown', function(e){
    if (document.getElementById('calwrap').classList.contains('on')) return;
    var q = Q[cur], el = document.getElementById('q' + cur);
    if (e.key === 'Enter' && !(q.type === 'long' && e.shiftKey)) { e.preventDefault(); return next(); }
    if (q.c && !e.metaKey && !e.ctrlKey && e.key.length === 1) {
      var b = el.querySelector('.ch button[data-key="' + e.key.toUpperCase() + '"]'); if (b) pick(cur, b);
    }
  });
  document.getElementById('up').addEventListener('click', function(){ if (cur > 0) show(cur - 1, -1); });
  document.getElementById('down').addEventListener('click', function(){ next(); });
  window.addEventListener('message', function(e){
    if (!e.data || e.data.event !== 'calendly.event_scheduled') return;
    location.href = '/apply-confirm/?name=' + encodeURIComponent((A.first_name || '').split(' ')[0]);
  });
  show(0, 1);
})();
</script>
</body>
</html>
