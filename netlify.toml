[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/vsl-img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# A/B test ended 24 Oct 2026 - A won. B pages kept in the repo but anyone landing on them is sent to A.
[[redirects]]
  from = "/v2"
  to = "/"
  status = 302
  force = true
[[redirects]]
  from = "/v2/"
  to = "/"
  status = 302
  force = true
[[redirects]]
  from = "/go-v2"
  to = "/go"
  status = 302
  force = true
[[redirects]]
  from = "/go-v2/"
  to = "/go"
  status = 302
  force = true
