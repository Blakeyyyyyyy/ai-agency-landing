<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis 2.0 Agreement</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f6;color:#1d2420;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:32px 18px 80px}
.brand{font-weight:800;letter-spacing:.02em;color:#1f9e78;font-size:14px;text-transform:uppercase}
h1{font-size:28px;margin:6px 0 4px;line-height:1.25}.sub{color:#5b6660;margin:0 0 22px}
.card{background:#fff;border:1px solid #e3e7e4;border-radius:14px;padding:22px 22px;margin-bottom:16px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}.sum div span{display:block;font-size:12px;color:#6b7670;text-transform:uppercase;letter-spacing:.04em}.sum div b{font-size:16px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}td,th{text-align:left;padding:7px 4px;border-top:1px solid #eef1ef}th{color:#6b7670;font-weight:600;font-size:12px}
.sec h3{font-size:16px;margin:18px 0 4px}.sec p{margin:0;color:#2f3833;font-size:15px}
label.f{display:block;font-weight:600;margin:14px 0 6px}input[type=text]{width:100%;padding:13px 14px;border:1px solid #cfd6d2;border-radius:10px;font-size:17px;font-family:inherit}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px}.chk input{width:20px;height:20px;margin-top:3px;accent-color:#1f9e78}
button{margin-top:18px;width:100%;padding:15px;border:0;border-radius:12px;background:#1f9e78;color:#fff;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}
.err{color:#c0392b;margin-top:10px;font-weight:600}.ok{text-align:center}.ok .tick{width:64px;height:64px;border-radius:50%;background:#e4f6ef;color:#1f9e78;font-size:34px;line-height:64px;margin:0 auto 10px}
.small{font-size:12px;color:#7a847f}
@media(max-width:560px){.sum{grid-template-columns:1fr}h1{font-size:24px}}
</style></head>
<body><div class="wrap" id="app"><p>Loading your agreement...</p></div>
<script>
var API='https://blake-discord-relay.vercel.app/api/agreement';
var a=new URLSearchParams(location.search).get('a')||'';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return 'USD '+Number(n).toLocaleString('en-US')}
var app=document.getElementById('app');
function done(name,at){app.innerHTML='<div class="card ok"><div class="tick">&#10003;</div><h1>Agreement signed</h1><p class="sub">Signed by <b>'+esc(name)+'</b>'+(at?' on '+esc(new Date(at).toLocaleString()):'')+'. A copy is on its way to your email. Welcome to Jarvis 2.0.</p></div>';}
fetch(API+'?a='+encodeURIComponent(a)).then(function(r){return r.json()}).then(function(d){
  if(!d.ok){app.innerHTML='<div class="card"><h1>Link not valid</h1><p class="sub">'+esc(d.error||'Please ask your advisor for a new link.')+'</p></div>';return;}
  if(d.signed){done(d.signed.name,d.signed.at);return;}
  var sch=d.schedule.map(function(s){return '<tr><td>Payment '+s.n+'</td><td>'+money(s.amount)+'</td><td>'+esc(s.due)+'</td></tr>'}).join('');
  app.innerHTML='<div class="brand">'+esc(d.company.trading)+'</div><h1>Jarvis 2.0 Program Agreement</h1><p class="sub">Please read it through, then sign at the bottom. It takes about 2 minutes.</p>'+
   '<div class="card"><div class="sum"><div><span>Client</span><b>'+esc(d.client)+'</b></div><div><span>Email</span><b>'+esc(d.email)+'</b></div><div><span>Program</span><b>Jarvis 2.0 (90 days)</b></div><div><span>Total</span><b>'+money(d.total)+'</b></div></div>'+
   '<table><tr><th>Instalment</th><th>Amount</th><th>Due</th></tr>'+sch+'</table></div>'+
   '<div class="card sec">'+d.sections.map(function(s,i){return '<h3>'+(i+1)+'. '+esc(s[0])+'</h3><p>'+esc(s[1])+'</p>'}).join('')+'</div>'+
   '<div class="card"><h3 style="margin-top:0">Sign</h3><label class="f" for="nm">Type your full legal name</label><input id="nm" type="text" autocomplete="name" placeholder="'+esc(d.client)+'">'+
   '<label class="chk"><input id="ag" type="checkbox"><span>I have read and agree to this agreement, and I agree that typing my name is my electronic signature.</span></label>'+
   '<button id="go">Sign agreement</button><div class="err" id="er"></div><p class="small">'+esc(d.company.legal)+' (ABN '+esc(d.company.abn)+'), '+esc(d.company.address)+'</p></div>';
  document.getElementById('go').onclick=function(){
    var nm=document.getElementById('nm').value.trim(),ag=document.getElementById('ag').checked,er=document.getElementById('er'),b=this;er.textContent='';
    if(nm.length<3){er.textContent='Please type your full name.';return;} if(!ag){er.textContent='Please tick the box to agree.';return;}
    b.disabled=true;b.textContent='Signing...';
    fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'sign',a:a,typedName:nm,agree:true})}).then(function(r){return r.json()}).then(function(j){
      if(j.ok){done(nm,j.at);window.scrollTo(0,0);}else{er.textContent=j.error||'Something went wrong. Please try again.';b.disabled=false;b.textContent='Sign agreement';}
    }).catch(function(){er.textContent='Connection problem. Please try again.';b.disabled=false;b.textContent='Sign agreement';});
  };
}).catch(function(){app.innerHTML='<div class="card"><h1>Could not load</h1><p class="sub">Please refresh the page.</p></div>';});
</script></body></html>
