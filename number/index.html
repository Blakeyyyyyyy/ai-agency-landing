<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>One thing and you're set</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--panel:#161616;--line:#2c2c2c;--white:#fff;--body:#e6e6e6;--green:#32d09f;--f:'Archivo',Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--f);font-weight:600;font-size:19px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:520px;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:36px 30px}
h1{color:var(--white);font-weight:900;text-transform:uppercase;letter-spacing:-.5px;line-height:1.05;font-size:clamp(1.9rem,6vw,2.6rem);margin-bottom:16px}
p{font-size:1.05rem;line-height:1.65}
.f{width:100%;background:#0d0d0d;border:2px solid #333;border-radius:12px;color:#fff;font-family:var(--f);font-weight:700;font-size:1.05rem;padding:16px;outline:none;margin-top:12px}
.f:focus{border-color:var(--green)}
.row{display:grid;grid-template-columns:110px 1fr;gap:10px}
button{width:100%;margin-top:14px;background:var(--green);color:#04140f;border:0;border-radius:12px;font-family:var(--f);font-weight:900;font-size:1.1rem;text-transform:uppercase;padding:18px;cursor:pointer}
button:disabled{opacity:.55}
.err{color:#ff8a7a;font-weight:700;min-height:1.3em;margin-top:10px;font-size:.95rem}
.done{display:none;text-align:center}.done.on{display:block}.ask.off{display:none}
.tick{width:64px;height:64px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.small{color:#9a9a9a;font-size:.85rem;margin-top:14px}
</style></head><body>
<div class="card">
  <div class="ask" id="ask">
    <h1>One thing<br>and you're set.</h1>
    <p id="lead">Nothing happens by email. Your Jarvis gets built on a five minute call, so I need a number.</p>
    <input class="f" id="email" type="email" placeholder="Your email" autocomplete="email" hidden>
    <div class="row">
      <input class="f" id="cc" type="text" value="+61" autocomplete="tel-country-code">
      <input class="f" id="phone" type="tel" inputmode="tel" placeholder="Your number" autocomplete="tel-national">
    </div>
    <div class="err" id="err"></div>
    <button id="go" type="button">Call me &rarr;</button>
    <p class="small">Only cost is the platform, about $50 a month. None of it comes to me.</p>
  </div>
  <div class="done" id="done">
    <div class="tick"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#0a0a0a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h1>Got it.</h1>
    <p>Someone from my team will call you today from a number you don't recognise. Keep your phone on you.</p>
  </div>
</div>
<script>
(function(){
  var U="https://klyiqncsgxcrbdgonaaj.supabase.co", K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtseWlxbmNzZ3hjcmJkZ29uYWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MjkxMTQsImV4cCI6MjA5MTAwNTExNH0.WuM-vY6LBoNF2XiQJG2YX5CDOa-AWVGlhobfeuBOLl8";
  var q=new URLSearchParams(location.search);
  var email=(q.get('e')||q.get('email')||'').trim().toLowerCase();
  var name=(q.get('n')||q.get('name')||'').trim();
  var emailEl=document.getElementById('email');
  if(!email){ emailEl.hidden=false; }
  if(name){ document.getElementById('lead').textContent=name.split(' ')[0]+', nothing happens by email. Your Jarvis gets built on a five minute call, so I need a number.'; }
  var cc=document.getElementById('cc'), ph=document.getElementById('phone'), err=document.getElementById('err'), go=document.getElementById('go');
  function post(body){ return fetch(U+'/rest/v1/waitlist_events',{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+K,'Prefer':'return=minimal'},body:JSON.stringify(body)}); }
  go.addEventListener('click',function(){
    err.textContent='';
    var e=email||emailEl.value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){ err.textContent='Add the email you signed up with.'; emailEl.hidden=false; return; }
    var v=ph.value.trim(); if(v.replace(/\D/g,'').length<6){ err.textContent='Pop your number in so we can call you.'; ph.focus(); return; }
    var full=cc.value.trim()+' '+v.replace(/^0+/,'');
    go.disabled=true; go.textContent='One sec...';
    post({email:e,name:name||null,question:'phone',answer:full}).then(function(r){
      if(r.ok||r.status===201||r.status===204){ document.getElementById('ask').classList.add('off'); document.getElementById('done').classList.add('on'); }
      else { go.disabled=false; go.textContent='Call me →'; err.textContent='That did not go through. Try again.'; }
    }).catch(function(){ go.disabled=false; go.textContent='Call me →'; err.textContent='No connection. Try again.'; });
  });
  ph.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); go.click(); } });
})();
</script></body></html>
