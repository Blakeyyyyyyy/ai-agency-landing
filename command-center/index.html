<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Agency Command Center — Command Center</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#000000;--green:#16a34a;--gl:#4ade80;--gb:#22c55e;--gd:#15803d;--red:#f43f5e;--yel:#eab308;--ora:#f97316;--blu:#38bdf8;--dim:rgba(255,255,255,.5);--dmr:rgba(255,255,255,.3);--card:rgba(255,255,255,.03);--bdr:rgba(255,255,255,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Montserrat',sans-serif;background:#000000!important;background-color:#000000!important;color:#fff;min-height:100vh;overflow-x:hidden}
.bg-orbs{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.12}
.o1{width:600px;height:600px;background:radial-gradient(circle,#16a34a,transparent 70%);top:-10%;left:-5%;animation:d1 20s ease-in-out infinite}
.o2{width:500px;height:500px;background:radial-gradient(circle,#fff,transparent 70%);top:30%;right:-10%;animation:d2 25s ease-in-out infinite}
.o3{width:450px;height:450px;background:radial-gradient(circle,#22c55e,transparent 70%);bottom:10%;left:20%;animation:d3 22s ease-in-out infinite}
.o4{width:350px;height:350px;background:radial-gradient(circle,#15803d,transparent 70%);top:60%;right:25%;animation:d4 18s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(80px,60px) scale(1.1)}50%{transform:translate(40px,120px) scale(.95)}75%{transform:translate(-40px,50px) scale(1.05)}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(-70px,80px) scale(1.08)}50%{transform:translate(-120px,30px) scale(.92)}75%{transform:translate(-50px,-40px) scale(1.12)}}
@keyframes d3{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(60px,-50px) scale(1.06)}50%{transform:translate(100px,-90px) scale(.94)}75%{transform:translate(30px,-30px) scale(1.1)}}
@keyframes d4{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(-40px,-60px) scale(1.15)}50%{transform:translate(30px,-100px) scale(.9)}75%{transform:translate(60px,-40px) scale(1.05)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
.wrap{position:relative;z-index:1}
.hdr{padding:24px 28px 16px;border-bottom:1px solid var(--bdr);background:rgba(255,255,255,.01);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand-sub{font-size:10px;letter-spacing:.2em;color:var(--dmr);font-weight:600;margin-bottom:4px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.03em}.brand span{color:var(--green)}
.dr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dr button{padding:6px 12px;font-size:11px;font-weight:600;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--dim);font-family:'Montserrat',sans-serif;transition:all .2s}
.dr button.a{background:rgba(22,163,74,.2);border-color:rgba(22,163,74,.4);color:var(--gl)}
.dr .sep{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 2px}
.dr input[type=date]{padding:5px 8px;font-size:11px;font-weight:600;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--dim);font-family:'Montserrat',sans-serif;width:130px}
.dr input[type=date].a{background:rgba(22,163,74,.2);border-color:rgba(22,163,74,.4);color:var(--gl)}
.dr input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.5)}
.nav{padding:14px 28px;display:flex;gap:6px;overflow-x:auto}
.nav button{padding:9px 16px;background:transparent;border:1px solid transparent;border-radius:10px;color:rgba(255,255,255,.45);font-size:12px;font-weight:600;cursor:pointer;font-family:'Montserrat',sans-serif;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:8px}
.nav button.a{background:rgba(22,163,74,.15);border-color:rgba(22,163,74,.3);color:var(--gl)}
.cnt{padding:0 28px 40px;max-width:1400px;margin:0 auto}
.sec{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:20px;margin-bottom:16px}
.sec-h{padding:14px 20px 6px;border-bottom:1px solid rgba(255,255,255,.04)}.sec-h span{font-size:11px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.4)}
.g{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g7{grid-template-columns:repeat(7,1fr)}
.kpi{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
.kpi .bar{position:absolute;top:0;left:0;right:0;height:2px;opacity:.8}.kpi .lbl{font-size:10px;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.45);text-transform:uppercase;margin-bottom:4px}.kpi .val{font-size:24px;font-weight:700;letter-spacing:-.02em}.kpi.sm .val{font-size:20px}.kpi.sm{padding:14px 16px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.hero-c{border-radius:16px;padding:22px 26px;background:var(--card);border:1px solid rgba(22,163,74,.15)}.hero-c.hl{background:rgba(34,197,94,.06);border-color:rgba(22,163,74,.25)}
.hero-c .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.4);margin-bottom:4px}.hero-c .val{font-size:30px;font-weight:900;letter-spacing:-.03em}
.fl{display:flex;flex-direction:column;gap:6px}.fl label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.fl input,.fl select{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;padding:10px 14px;font-size:14px;font-family:'Montserrat',sans-serif;width:100%;outline:none}.fl input:focus,.fl select:focus{border-color:rgba(22,163,74,.5)!important}.fl select{appearance:none}select option{background:#1a1a2e}
.btn{padding:12px 24px;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Montserrat',sans-serif;width:100%;transition:all .2s}.btn:hover{filter:brightness(1.1)}
.toast{position:fixed;top:20px;right:20px;z-index:999;padding:14px 24px;background:var(--gb);border-radius:10px;font-weight:700;font-size:14px;animation:fadeIn .3s ease;display:none}.toast.show{display:block}
.rr{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.6)}
.sub-tabs{display:flex;gap:8px;margin-bottom:16px}.sub-tabs button{flex:1;padding:12px;font-size:13px;font-weight:700;border-radius:10px;cursor:pointer;text-align:center;background:var(--card);border:1px solid var(--bdr);color:rgba(255,255,255,.4);font-family:'Montserrat',sans-serif;transition:all .2s}.sub-tabs button.a{background:rgba(22,163,74,.15);border-color:rgba(22,163,74,.3);color:var(--gl)}
.funnel-r{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;border:1px solid transparent}.funnel-r.worst{background:rgba(244,63,94,.04);border-color:rgba(244,63,94,.1)}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;font-size:16px;color:var(--green);flex-direction:column;gap:8px}
.spin{width:32px;height:32px;border:3px solid rgba(22,163,74,.2);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Login screen */
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .4s ease,transform .4s ease}
.login-overlay.hide{opacity:0;pointer-events:none;transform:scale(1.03)}
.login-box{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding:40px;width:100%;max-width:380px}
.login-brand{font-size:32px;font-weight:900;letter-spacing:-.04em}
.login-brand span{color:var(--green)}
.login-sub{font-size:12px;letter-spacing:.3em;color:var(--dmr);font-weight:600;text-transform:uppercase}
.login-line{width:min(280px,80vw);height:2px;background:linear-gradient(90deg,transparent,var(--green),var(--gb),transparent);border-radius:2px}
.login-input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;padding:14px 16px;font-size:14px;font-family:'Montserrat',sans-serif;text-align:center;letter-spacing:.05em;outline:none;transition:border-color .2s}
.login-input:focus{border-color:var(--green)}
.login-input.error{border-color:#f43f5e;animation:loginShake .4s ease}
.login-btn{width:100%;padding:14px;border:none;border-radius:10px;background:var(--gb);color:#fff;font-size:14px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;letter-spacing:.05em;transition:opacity .2s}
.login-btn:hover{opacity:.9}
.login-err{font-size:12px;color:#f43f5e;min-height:18px}
@keyframes loginShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* Deal Closed Celebration */
.deal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9998;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;opacity:0;transition:opacity .3s ease}
.deal-overlay.show{opacity:1;pointer-events:auto}
.deal-overlay.out{opacity:0}
.deal-bg{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.deal-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:0 24px}
.deal-check{width:80px;height:80px;border-radius:50%;background:var(--gb);display:flex;align-items:center;justify-content:center;transform:scale(0);animation:dealPop .5s cubic-bezier(.175,.885,.32,1.275) forwards .2s;box-shadow:0 0 60px rgba(34,197,94,.4)}
.deal-check svg{width:40px;height:40px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:50;stroke-dashoffset:50;animation:dealDraw .6s ease forwards .5s}
.deal-title{font-size:28px;font-weight:900;letter-spacing:-.02em;opacity:0;transform:translateY(16px);animation:introFadeUp .5s ease forwards .5s}
.deal-name{font-size:18px;font-weight:700;color:var(--gb);opacity:0;transform:translateY(12px);animation:introFadeUp .4s ease forwards .7s}
.deal-amount{font-size:36px;font-weight:900;color:var(--gb);opacity:0;transform:translateY(12px);animation:introFadeUp .4s ease forwards .9s;text-shadow:0 0 30px rgba(34,197,94,.3)}
.deal-sub{font-size:12px;color:var(--dmr);letter-spacing:.15em;text-transform:uppercase;font-weight:600;opacity:0;animation:introFadeUp .4s ease forwards 1.1s}
@keyframes dealPop{to{transform:scale(1)}}
@keyframes dealDraw{to{stroke-dashoffset:0}}
.confetti{position:absolute;width:8px;height:8px;border-radius:2px;top:40%;animation:confettiFall 1.5s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(400px) rotate(720deg) scale(0);opacity:0}}

/* Leaderboard Fire Effect */
.lb-fire{position:relative;display:inline-block}
.lb-fire::before{content:'';position:absolute;inset:-4px -8px;border-radius:10px;background:linear-gradient(90deg,rgba(234,179,8,.15),rgba(249,115,22,.2),rgba(239,68,68,.15),rgba(249,115,22,.2),rgba(234,179,8,.15));background-size:200% 100%;animation:fireGlow 2s ease-in-out infinite;z-index:-1;filter:blur(6px)}
.lb-fire::after{content:'🔥';position:absolute;right:-24px;top:50%;transform:translateY(-50%);font-size:14px;animation:fireFlicker 1s ease-in-out infinite alternate}
@keyframes fireGlow{0%,100%{background-position:0% 50%;opacity:.6}50%{background-position:100% 50%;opacity:1}}
@keyframes fireFlicker{0%{transform:translateY(-50%) scale(1);opacity:.8}100%{transform:translateY(-55%) scale(1.15);opacity:1}}
.lb-row-1{animation:rowPulse 3s ease-in-out infinite}
@keyframes rowPulse{0%,100%{box-shadow:inset 0 0 0 rgba(34,197,94,0)}50%{box-shadow:inset 0 0 30px rgba(34,197,94,.06)}}
.lb-spark{position:absolute;width:3px;height:3px;border-radius:50%;pointer-events:none;animation:sparkFloat 2s ease-out infinite}
@keyframes sparkFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-30px) scale(0);opacity:0}}

::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
@media(max-width:768px){.g4,.g5,.g7{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.hero-c .val{font-size:24px}.hdr,.cnt{padding-left:16px;padding-right:16px}.nav{padding:10px 16px}.dr{display:none}}
</style>
</head>
<body>
<div class="bg-orbs"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div></div>
<div class="login-overlay" id="loginScreen">
<div class="login-box">
<div class="login-brand"><span>AI Agency</span> Command Center</div>
<div class="login-line"></div>
<div class="login-sub">Command Center</div>
<input type="password" class="login-input" id="loginPw" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
<button class="login-btn" onclick="doLogin()">Access Dashboard</button>
<div class="login-err" id="loginErr"></div>
</div>
</div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="deal-overlay" id="dealOverlay">
<div class="deal-bg"></div>
<div class="deal-content">
<div class="deal-check"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg></div>
<div class="deal-title">DEAL CLOSED 🏆</div>
<div class="deal-name" id="dealName"></div>
<div class="deal-amount" id="dealAmount"></div>
<div class="deal-sub">New enrollment added</div>
</div>
</div>
<script>
// ══════════════════════════════════════════════
// ⚙️ PASTE YOUR GOOGLE APPS SCRIPT URL HERE ⚙️
// ══════════════════════════════════════════════
const API = 'https://script.google.com/macros/s/AKfycby6C4tcqW0JagNAef1X_yxI7AvYtBMpnCK_iuxSYDteYyYVOJ8JPCGbkPNlFsqKkdG6/exec';
// ══════════════════════════════════════════════

// ── Passwords & Roles ──
const PASSWORDS={"forge9670":"setter","vault4808":"closer","course6198":"leadership"};
const ROLE_TABS={setter:['dashboard','setter_tracker','setter'],closer:['dashboard','setter_tracker','setter','sales_tracker','closer','enrollments'],leadership:['dashboard','setter_tracker','setter','sales_tracker','closer','enrollments','settings']};
let userRole=sessionStorage.getItem('aiagency_role')||null;
function doLogin(){
  const pw=document.getElementById('loginPw').value.trim();
  const role=PASSWORDS[pw];
  if(!role){document.getElementById('loginErr').textContent='Invalid password';document.getElementById('loginPw').classList.add('error');setTimeout(()=>document.getElementById('loginPw').classList.remove('error'),400);return;}
  userRole=role;sessionStorage.setItem('aiagency_role',role);
  const ls=document.getElementById('loginScreen');if(ls){ls.classList.add('hide');setTimeout(()=>ls.style.display='none',400);}
  if(dataReady){render();}else{document.getElementById('app').innerHTML='<div class="loading"><div class="spin"></div>Loading data...</div>';}
}
let dataReady=false;
if(userRole){const ls=document.getElementById('loginScreen');if(ls)ls.style.display='none';}

const S={view:'dashboard',dateRange:'this_month',closerSub:'eod',closer_reports:[],setter_reports:[],call_reports:[],enrollments:[],
  editingCloser:null, editingCloserRow:null,
  editingSetter:null, editingSetterRow:null,
  editingCall:null, editingCallRow:null,
  editingDeal:null, editingDealRow:null,
  editingEnroll:null, editingEnrollRow:null,
  closers:JSON.parse(localStorage.getItem('aiagency_closers')||'null')||['Closer 1'],
  setters:JSON.parse(localStorage.getItem('aiagency_setters')||'null')||['Setter 1'],
  packages:JSON.parse(localStorage.getItem('aiagency_packages')||'null')||['Base44 Builder Pro Monthly'],
  customStart:'',
  customEnd:'',
  paymentDays:7,
  selectedClosers:JSON.parse(localStorage.getItem('aiagency_selectedClosers')||'null')||null,
  selectedSetters:JSON.parse(localStorage.getItem('aiagency_selectedSetters')||'null')||null,
  salesSub:'stats',
  lbCol1:'cl',lbCol2:'cv',lbCol3:'clR',
  lbW1:40,lbW2:20,lbW3:40,
  stLbW1:40,stLbW2:20,stLbW3:40,
  selectedSource:'all',
  benchmarks:JSON.parse(localStorage.getItem('aiagency_benchmarks')||'null')||{dialConvo:.03,pitchedBooked:.70,bookedCalls:.70,callsOffers:.75,offersCloses:.35},
};
// Sync selectedClosers with closers on load
if(S.selectedClosers){
  S.closers.forEach(c=>{if(!S.selectedClosers.includes(c))S.selectedClosers.push(c)});
  S.selectedClosers=S.selectedClosers.filter(c=>S.closers.includes(c));
  localStorage.setItem('aiagency_selectedClosers',JSON.stringify(S.selectedClosers));
}
// Sync selectedSetters with setters on load
if(S.selectedSetters){
  S.setters.forEach(c=>{if(!S.selectedSetters.includes(c))S.selectedSetters.push(c)});
  S.selectedSetters=S.selectedSetters.filter(c=>S.setters.includes(c));
  localStorage.setItem('aiagency_selectedSetters',JSON.stringify(S.selectedSetters));
}
const $=id=>document.getElementById(id);
const V=id=>$(id)?.value||'';
const N=id=>Number(V(id))||0;
const fmt=n=>{if(n==null||isNaN(n))return'$0';return'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:n%1!==0?2:0,maximumFractionDigits:2})};
const pct=n=>(isNaN(n)||!isFinite(n)?'0%':(n*100).toFixed(1)+'%');
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const mn=m=>['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m];
// Normalize any date value to YYYY-MM-DD in CST (UTC-6)
function normDate(v){
  if(!v)return '';
  const s=String(v);
  // Already YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  // ISO timestamp — extract date using UTC methods to avoid timezone shift
  const d=new Date(s);
  if(isNaN(d))return s;
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
// Format YYYY-MM-DD as "Mar 25, 2026"
function fmtDate(v){
  const s=normDate(v);
  if(!s)return '';
  const [y,m,d]=s.split('-');
  return mn(parseInt(m,10)-1)+' '+parseInt(d,10)+', '+y;
}

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function savePackages(){
  localStorage.setItem('aiagency_packages',JSON.stringify(S.packages));
}
async function syncConfigToSheet(showToast,scope){
  try{
    if(showToast)toast('Saving settings...');
    // saveConfig replaces the whole config blob (no merge on the Apps Script
    // side). Re-read the live config first and overlay ONLY the fields this
    // save is meant to change, so a stale tab can't wipe other people's edits
    // (e.g. a newly added setter). If the fresh read fails, abort - never
    // overwrite blind.
    const fresh=await(await fetch(API+'?action=loadConfig')).json();
    if(!fresh||typeof fresh!=='object'||Array.isArray(fresh))throw new Error('bad config read');
    const merged={...fresh};
    scope=scope||'team';
    if(scope==='team'){merged.closers=S.closers;merged.setters=S.setters;merged.packages=S.packages;}
    else if(scope==='commission'){merged.revenueByPlan=S.revenueByPlan||{};merged.commissionByPlan=S.commissionByPlan||{};}
    else if(scope==='discord'){merged.discord=DISCORD;}
    const r=await apiSaveConfig(merged);
    if(showToast)toast('Settings saved & synced!');
    return r;
  }catch(e){
    console.error('Config sync error',e);
    if(showToast)toast('Sync failed - nothing was changed, try again');
  }
}
function saveBenchmarks(){
  localStorage.setItem('aiagency_benchmarks',JSON.stringify(S.benchmarks));
}
function updateBenchmarks(){
  S.benchmarks.dialConvo=(Number(document.getElementById('bm-dc').value)||3)/100;
  S.benchmarks.pitchedBooked=(Number(document.getElementById('bm-pb').value)||70)/100;
  S.benchmarks.bookedCalls=(Number(document.getElementById('bm-bc').value)||70)/100;
  S.benchmarks.callsOffers=(Number(document.getElementById('bm-co').value)||75)/100;
  S.benchmarks.offersCloses=(Number(document.getElementById('bm-oc').value)||35)/100;
  saveBenchmarks();
  toast('Benchmarks saved!');
  render();
}
function saveTeam(){
  localStorage.setItem('aiagency_closers',JSON.stringify(S.closers));
  localStorage.setItem('aiagency_setters',JSON.stringify(S.setters));
  if(S.selectedClosers){
    S.closers.forEach(c=>{if(!S.selectedClosers.includes(c))S.selectedClosers.push(c)});

function celebrateDeal(name,amount){
  const ov=$('dealOverlay');
  $('dealName').textContent=name;
  $('dealAmount').textContent=fmt(amount);
  const content=ov.querySelector('.deal-content');
  const clone=content.cloneNode(true);
  clone.querySelector('.deal-name').textContent=name;
  clone.querySelector('.deal-amount').textContent=fmt(amount);
  content.parentNode.replaceChild(clone,content);
  const colors=['#22c55e','#4ade80','#16a34a','#fff','#eab308','#38bdf8','#f43f5e','#a855f7'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'%';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=(Math.random()*.8)+'s';
    c.style.animationDuration=(1+Math.random()*1.5)+'s';
    c.style.width=(4+Math.random()*8)+'px';
    c.style.height=(4+Math.random()*8)+'px';
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    ov.appendChild(c);
  }
  ov.classList.add('show');
  ov.classList.remove('out');
  setTimeout(()=>{
    ov.classList.add('out');
    setTimeout(()=>{
      ov.classList.remove('show','out');
      ov.querySelectorAll('.confetti').forEach(c=>c.remove());
    },500);
  },3500);
}

// ── Date range ──
function localDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function db(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),t=td();
  const ye=new Date(now);ye.setDate(now.getDate()-1);const ys=localDateStr(ye);
  const sw=new Date(now);sw.setDate(now.getDate()-now.getDay());
  const p=n=>String(n).padStart(2,'0');
  switch(S.dateRange){
    case'today':return{s:t,e:t,l:'Today'};case'yesterday':return{s:ys,e:ys,l:'Yesterday'};
    case'this_week':return{s:localDateStr(sw),e:t,l:'This Week'};
    case'this_month':return{s:`${y}-${p(m+1)}-01`,e:t,l:mn(m)+' '+y};
    case'last_month':{const lm=m===0?11:m-1,ly=m===0?y-1:y,ld=new Date(ly,lm+1,0).getDate();return{s:`${ly}-${p(lm+1)}-01`,e:`${ly}-${p(lm+1)}-${ld}`,l:mn(lm)+' '+ly};}
    case'q1':return{s:`${y}-01-01`,e:`${y}-03-31`,l:'Q1 '+y};case'q2':return{s:`${y}-04-01`,e:`${y}-06-30`,l:'Q2 '+y};
    case'q3':return{s:`${y}-07-01`,e:`${y}-09-30`,l:'Q3 '+y};case'q4':return{s:`${y}-10-01`,e:`${y}-12-31`,l:'Q4 '+y};
    case'ytd':return{s:`${y}-01-01`,e:t,l:'YTD '+y};case'all_time':return{s:'2020-01-01',e:t,l:'All Time'};
    case'custom':return{s:S.customStart||t,e:S.customEnd||t,l:'Custom Range'};
    default:return{s:`${y}-${p(m+1)}-01`,e:t,l:mn(m)+' '+y};
  }
}
const inR=d=>{const b=db();return d>=b.s&&d<=b.e};

  const tCR=ca.length,tCOM=ca.filter(r=>r.offerMade==='Yes').length,tCDC=ca.filter(r=>r.dealClosed==='Yes').length;

  return{tDi,tUL,tPU,tCo,tPB,tCB,tSB,tSS,tSC,tOf,tCl,tNS,tRE,tCn,tCF,tCL,tCS,tGH,tDe,tCa,tRC,tCV,tRev,clR,shR,nsR,d2c,d2pu,pu2co,co2pb,pb2bk,p2s,c2b,cl2c,rSS,cSS,rCl,aCV,aov,cBK,ofClR,cOf,rOf,rBK,clLR,csSR,ghR,aE,pif,spl,rP,obj,tCR,tCOM,tCDC,aStc,reR,cfR};

async function submitSetter(){

    byRep[rep].count+=1;
    byRep[rep].revenue+=Number(r.revenue)||0;
    const c=(S.commissionByPlan||{})[(r.product||'').replace('Base44 ','')];
    byRep[rep].commission+=c!=null?Number(c):0;
  });
  return{
    count:rows.length,

    commission:Object.values(byRep).reduce((s,x)=>s+x.commission,0),

  };

function closerLeaderboardData(){
  const sm=(a,f)=>a.reduce((s,r)=>s+(Number(r[f])||0),0);
  return S.closers.map(name=>{
    const cr=S.closer_reports.filter(r=>inR(r.date)&&r.closerName===name);
    const sc=sm(cr,'scheduledCalls'),cf=sm(cr,'confirmedCalls'),lc=sm(cr,'ssTaken'),of=sm(cr,'offers'),cl=sm(cr,'closes'),re=sm(cr,'rescheduled'),clL=sm(cr,'cancelledLead'),clS=sm(cr,'cancelledSetter'),gh=sm(cr,'ghosted'),ns=clL+clS+re+gh;
    const ca=sm(cr,'cashCollected'),rc=sm(cr,'recurringCash'),cv=sm(cr,'contractValue'),dep=sm(cr,'deposit');
    const tc=ca+rc,rev=cv||ca;
    const showP=sc>0?lc/sc:0,offerP=lc>0?of/lc:0,ofCommitP=of>0?(dep+cl)/of:0,ofCloseP=of>0?cl/of:0;
    const callCommitP=lc>0?(dep+cl)/lc:0,callCloseP=lc>0?cl/lc:0,clR=lc>0?cl/lc:0;
    const tcPct=cv>0?tc/cv:0,collOffer=of>0?tc/of:0,collCall=lc>0?tc/lc:0;
    const revOffer=of>0?rev/of:0,revCall=lc>0?rev/lc:0;
    const aov=cl>0?ca/cl:0;
    const newRev=cv,newCash=ca,cashBkd=sc>0?ca/sc:0,cashOffer=of>0?ca/of:0,revPerOffer=of>0?rev/of:0,cashCollPct=cv>0?ca/cv:0,cashLive=lc>0?ca/lc:0,revLive=lc>0?rev/lc:0;
    const reR=sc>0?re/sc:0,clLR=sc>0?clL/sc:0,csSR=sc>0?clS/sc:0,ghR=sc>0?gh/sc:0;
    return{name,sc,cf,lc,of,cl,dep,ca,rc,cv,tc,rev,clR,showP,offerP,ofCommitP,ofCloseP,callCommitP,callCloseP,tcPct,collOffer,collCall,revOffer,revCall,aov,newRev,newCash,cashBkd,cashOffer,revPerOffer,cashCollPct,cashLive,revLive,re,clL,clS,gh,ns,reR,clLR,csSR,ghR,days:cr.length};
  });
}
const LB_COLS={
  count:[
    {k:'sc',l:'Calls Booked'},{k:'cf',l:'Confirmed'},{k:'lc',l:'Calls Taken'},{k:'re',l:'Rescheduled'},{k:'clL',l:'Cancelled (Lead)'},{k:'clS',l:'Cancelled (Setter)'},{k:'gh',l:'Ghosted'},{k:'ns',l:'No Shows'},{k:'of',l:'Offers'},{k:'dep',l:'Deposits'},{k:'cl',l:'Closes'}
  ],
  money:[
    {k:'tc',l:'Total Collected ($)'},{k:'cv',l:'Total Revenue ($)'},{k:'newRev',l:'New Revenue ($)'},{k:'newCash',l:'New Cash ($)'},{k:'aov',l:'Cash / Close AOV ($)'},{k:'cashBkd',l:'Cash / Booked ($)'},{k:'cashLive',l:'Cash / Live Call ($)'},{k:'revLive',l:'Rev / Live Call ($)'},{k:'cashOffer',l:'Cash / Offer ($)'},{k:'revPerOffer',l:'Rev / Offer ($)'},{k:'collOffer',l:'Collected / Offer ($)'},{k:'collCall',l:'Collected / Call ($)'},{k:'revOffer',l:'Revenue / Offer ($)'},{k:'revCall',l:'Revenue / Call ($)'}

  ]
};
function lbFormat(k,v){
  const money=['tc','cv','aov','collOffer','collCall','revOffer','revCall','newRev','newCash','cashBkd','cashLive','revLive','cashOffer','revPerOffer'];
  const pcts=['showP','offerP','ofCommitP','ofCloseP','callCommitP','callCloseP','tcPct','cashCollPct','clR','reR','clLR','csSR','ghR'];
  if(money.includes(k))return fmt(v);
  if(pcts.includes(k))return pct(v);
  return v.toLocaleString();
}
function lbRank(data,k){
  const sorted=[...data].map((c,i)=>({i,v:c[k]||0})).sort((a,b)=>b.v-a.v);
  const ranks=new Array(data.length);
  sorted.forEach((s,ri)=>{ranks[s.i]=ri+1});
  return ranks;
}

async function executeMasterReset(){
  toast('Resetting all data...');
  try{

    if(j.status==='ok'){
      S.closer_reports=[];S.setter_reports=[];S.call_reports=[];S.enrollments=[];
      toast('All data has been erased.');

function setterTrackerData(){

    const sr=S.setter_reports.filter(r=>inR(r.date)&&r.setterName===name);

    const ud=sm(sr,'uniqueLeadsDialed'),td=sm(sr,'totalDials'),pu=sm(sr,'pickUps'),co=sm(sr,'conversationsOnPhone'),pb=sm(sr,'pitchedBookings'),bk=sm(sr,'bookedAppointments'),sb=sm(sr,'selfBooked'),cs=sm(sr,'callsShowed');
    const calls=ca.length,closes=ca.filter(r=>r.dealClosed==='Yes').length;

    const d2pu=td>0?pu/td:0,pu2co=pu>0?co/pu:0,co2pb=co>0?pb/co:0,pitchedSetR=pb>0?bk/pb:0;

    const cashPerLive=calls>0?cash/calls:0,revPerLive=calls>0?cv/calls:0;

// ── Main render (YouTube tab removed) ──
function render(){
  const allTabs=[['dashboard','📊','Dashboard'],['sales_tracker','📈','Sales Tracker'],['setter_tracker','📋','Setter Tracker'],['setter','📞','Setter'],['closer','💰','Closer'],['enrollments','🎓','Enrollments'],['settings','⚙️','Settings']];
  const allowed=ROLE_TABS[userRole]||[];
  const tabs=allTabs.filter(([v])=>allowed.includes(v));
  if(!allowed.includes(S.view)&&tabs.length)S.view=tabs[0][0];
  const dr=[['today','Today'],['yesterday','Yesterday'],['this_week','This Week'],['this_month','This Month'],['last_month','Last Month']];
  const dq=[['q1','Q1'],['q2','Q2'],['q3','Q3'],['q4','Q4']];
  const dx=[['ytd','YTD'],['all_time','All Time']];
  let c='';
  switch(S.view){case'dashboard':c=renderDash();break;case'sales_tracker':c=renderSalesTracker();break;case'setter_tracker':c=renderSetterTracker()+renderEodList();break;case'setter':c=renderSetter();break;case'closer':c=renderCloser();break;case'enrollments':c=renderEnroll();break;case'settings':c=renderSettings();break;default:c=renderDash()}
  $('app').innerHTML=`<div class="hdr"><div><div class="brand-sub">COMMAND CENTER</div><div class="brand"><span>AI Agency</span> Command Center</div></div><div class="dr">${dr.map(([k,l])=>`<button class="${S.dateRange===k?'a':''}" onclick="S.dateRange='${k}';render()">${l}</button>`).join('')}<div class="sep"></div>${dq.map(([k,l])=>`<button class="${S.dateRange===k?'a':''}" onclick="S.dateRange='${k}';render()">${l}</button>`).join('')}<div class="sep"></div>${dx.map(([k,l])=>`<button class="${S.dateRange===k?'a':''}" onclick="S.dateRange='${k}';render()">${l}</button>`).join('')}<div class="sep"></div><input type="date" id="dr-start" class="${S.dateRange==='custom'?'a':''}" value="${S.customStart}" onchange="S.customStart=this.value;S.dateRange='custom';render()"><span style="color:var(--dmr);font-size:11px">→</span><input type="date" id="dr-end" class="${S.dateRange==='custom'?'a':''}" value="${S.customEnd}" onchange="S.customEnd=this.value;S.dateRange='custom';render()"></div></div><div class="nav">${tabs.map(([v,i,l])=>`<button class="${S.view===v?'a':''}" onclick="S.view='${v}';render()"><span style="font-size:16px">${i}</span>${l}</button>`).join('')}</div><div class="cnt">${c}</div>`;
  setTimeout(watchDealClosed,0);
}

// ── Load data from Sheets ──
async function reload(){
  try{
    const [d,cfg]=await Promise.all([
      apiRead(),
      fetch(API+'?action=loadConfig').then(r=>r.json()).catch(()=>null)
    ]);
    const nd=r=>{if(r.date)r.date=normDate(r.date);return r;};
    const ne=r=>{['date','dateJoined','p1Due','p2Due','p3Due'].forEach(k=>{if(r[k])r[k]=normDate(r[k])});return r;};
    S.closer_reports=(d.closer_reports||[]).map(nd);
    S.setter_reports=(d.setter_reports||[]).filter(r=>r.setterName).map(nd);
    S.call_reports=(d.call_reports||[]).map(nd);
    S.enrollments=(d.enrollments||[]).map(ne);
    S.signups=(d.signups||[]).map(nd);
    // Commission config lives in the Apps Script's own saveConfig/loadConfig.
    S.revenueByPlan=(cfg&&cfg.revenueByPlan)||S.revenueByPlan||{};
    S.commissionByPlan=(cfg&&cfg.commissionByPlan)||S.commissionByPlan||{};
    // Shared team lists also live there (action=read has no config block), so
    // every device sees the same setters/closers/packages, not its own localStorage.
    if(cfg){
      if(Array.isArray(cfg.setters)&&cfg.setters.length){S.setters=cfg.setters;localStorage.setItem('aiagency_setters',JSON.stringify(S.setters));}
      if(Array.isArray(cfg.closers)&&cfg.closers.length){S.closers=cfg.closers;localStorage.setItem('aiagency_closers',JSON.stringify(S.closers));}
      if(Array.isArray(cfg.packages)&&cfg.packages.length){S.packages=cfg.packages;localStorage.setItem('aiagency_packages',JSON.stringify(S.packages));}
    }
    // Load shared config from Google Sheet (overrides localStorage defaults)
    if(d.config){
      if(d.config.closers&&Array.isArray(d.config.closers)&&d.config.closers.length>0){
        S.closers=d.config.closers;
        localStorage.setItem('aiagency_closers',JSON.stringify(S.closers));
      }
      if(d.config.setters&&Array.isArray(d.config.setters)&&d.config.setters.length>0){
        S.setters=d.config.setters;
        localStorage.setItem('aiagency_setters',JSON.stringify(S.setters));
      }
      if(d.config.packages&&Array.isArray(d.config.packages)&&d.config.packages.length>0){
        S.packages=d.config.packages;
        localStorage.setItem('aiagency_packages',JSON.stringify(S.packages));
      }
      if(d.config.discord&&typeof d.config.discord==='object'){
        Object.assign(DISCORD,d.config.discord);
        localStorage.setItem('aiagency_discord',JSON.stringify(DISCORD));
      }
    }
    
    dataReady=true;
    if(userRole){
      render();
    }
  }catch(e){
    console.error('Load error',e);
    const ls=$('loginScreen');if(ls)ls.style.display='none';
    $('app').innerHTML='<div class="loading" style="color:#f43f5e">Failed to load data. Check your Apps Script URL.</div>';
  }
}

// ── Init ──
reload();
